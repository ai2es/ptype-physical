# Event windows for the fast HRRR inference run list.
#
# Each event gives the first and last valid days (UTC) of the storm. The run list
# starts `lead_days` before `event_start` so that every forecast hour that verifies
# inside the event has been initialized, and it runs hourly inits through the end of
# `event_end`. Overlapping or back-to-back windows are merged when the runs are built.
lead_days: 2
init_interval_hours: 1

events:
  - name: "December 2023 reference case"
    event_start: 2023-12-23
    event_end: 2023-12-27
    source: "Reference case"
  - name: "Early November lake-effect snow"
    event_start: 2025-11-09
    event_end: 2025-11-11
    source: "Wikipedia, 2025-26 North American winter"
  - name: "US Thanksgiving Week blizzard"
    event_start: 2025-11-24
    event_end: 2025-11-27
    source: "Wikipedia, 2025-26 North American winter"
