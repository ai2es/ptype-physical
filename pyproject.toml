[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "ptype-physical"
authors = [{name = "University Corporation for Atmospheric Research", email = "miles@ucar.edu"}]
readme = "README.md"
license = {file = "LICENSE"}
dynamic = ["version"]
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "cartopy",
    "pandas",
    "keras",
    "torch",
    "xarray",
    "h5netcdf",
    "zarr",
    "pyarrow",
    "scikit-learn",
    "tqdm",
    "miles-guess",
    "bridgescaler",
    "hagelslag",
    "metpy",
    "joblib",
    "herbie-data",
    "seaborn",
    "geopandas"
            ]
[project.optional-dependencies]
# Extra packages for the fast HRRR inference pipeline in ptype.hrrr_fast. They are optional so the
# training and analysis code keeps its lighter install. cast-value-rs provides the Zarr v3
# cast_value codec used for the scaled-integer encodings that the website's zarrita can decode.
hrrr_fast = ["numba", "obstore", "eccodes", "zarr>=3.4", "cast-value-rs", "pyproj", "onnx", "onnxruntime", "pyyaml", "psutil", "boto3"]

[tool.setuptools]
packages = ["ptype", "ptype.soundings", "ptype.hrrr_fast"]

[tool.setuptools_scm]
version_file = "ptype/_version.py"

[tool.ruff]
target-version = "py312"
src = ["ptype", "tests", "applications"]
line-length = 180

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
markers = ["network: tests that read from the public HRRR bucket (skipped unless PTYPE_NETWORK_TESTS=1)"]
